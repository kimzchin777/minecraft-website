<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            padding: 20px;
            background-color: #111;
        }
        .map-icon-container {
            margin: 50px auto;
        }
        .map-icon {
            width: 128px;
            height: 128px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .map-icon:hover {
            transform: scale(1.2);
        }
        .stats {
            margin-top: 50px;
            background-color: #111;
            padding: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Minecraft Server</h1>
</header>

<div class="map-icon-container">
    <!-- Ikonka mapy Minecraft -->
    <a href="http://212.232.28.94:25123/" target="_blank">
        <img src="minecraft-map-icon.png" alt="Mapa serwera" class="map-icon">
    </a>
    <p>Kliknij ikonę, aby otworzyć pełną mapę</p>
</div>

<div class="stats">
    <h2>Statystyki serwera</h2>
    <p>Gracze online: <span id="players">0</span></p>
    <p>Zgony: <span id="deaths">0</span></p>
    <p>Zabójstwa: <span id="kills">0</span></p>
</div>

<script>
// PRZYKŁADOWY skrypt do symulowania statystyk (zastąp własnym API)
function updateStats() {
    document.getElementById('players').innerText = Math.floor(Math.random() * 20);
    document.getElementById('deaths').innerText = Math.floor(Math.random() * 100);
    document.getElementById('kills').innerText = Math.floor(Math.random() * 50);
}

setInterval(updateStats, 10000); // aktualizacja co 10 sekund
updateStats();
</script>

</body>
</html>
